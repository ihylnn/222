<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍珠奶茶吸管組裝大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
        }

        /* 珍珠動畫特效 */
        @keyframes pearl-roll {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        .animate-pearls-roll .pearl-item {
            animation: pearl-roll 0.6s ease-in-out infinite alternate;
        }

        /* 吸珍珠上升動畫 */
        @keyframes pearl-suck {
            0% { bottom: 10px; opacity: 1; transform: translateX(-50%) scale(1); }
            85% { bottom: 260px; opacity: 1; transform: translateX(-50%) scale(0.9); }
            100% { bottom: 285px; opacity: 0; transform: translateX(-50%) scale(0.5); }
        }
        .sucking-pearl {
            position: absolute;
            left: 50%;
            width: 12px;
            height: 12px;
            background: #1c100b;
            border: 1px solid #92400e;
            border-radius: 50%;
            z-index: 35;
            animation: pearl-suck 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* 玻璃杯質感 */
        .glass-cup {
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
            backdrop-filter: blur(4px);
            border-left: 3px solid #475569;
            border-right: 3px solid #475569;
            border-bottom: 4px solid #334155;
            box-shadow: inset 0 -8px 12px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.08);
        }

        /* 彩花慶祝動畫 */
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(320px) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            top: 0;
            z-index: 50;
            animation: confetti-fall 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body class="bg-amber-50/80 min-h-screen flex flex-col items-center justify-between p-3 md:p-5 selection:bg-amber-200 text-slate-800">

    <!-- 頂部標題區 -->
    <header class="text-center my-1 w-full max-w-4xl">
        <div class="inline-flex items-center gap-2 bg-amber-100/80 px-4 py-1.5 rounded-full border border-amber-300/60 shadow-sm mb-1">
            <span class="text-xl">🧋</span>
            <h1 class="text-xl md:text-2xl font-black text-amber-950 tracking-wide">
                珍珠奶茶吸管組裝大冒險
            </h1>
        </div>
        <p class="text-amber-800 text-xs md:text-sm font-bold mt-1">
            🎯 任務：組裝 3 支吸管！總長度必須 <span class="bg-red-500 text-white px-2 py-0.5 rounded-full font-black text-xs md:text-sm shadow-sm inline-block mx-0.5">大於 27 公分</span> 才吸得到珍珠！
        </p>
    </header>

    <!-- 遊戲主要內容卡片 -->
    <main class="bg-white rounded-3xl shadow-xl border-4 border-amber-200/90 p-4 md:p-6 max-w-4xl w-full flex flex-col md:flex-row gap-6 relative overflow-hidden my-auto">
        
        <!-- 左側：刻度尺與珍奶杯展示區 (高度 300px，1cm = 10px) -->
        <div id="visual-stage" class="flex-1 flex flex-col items-center justify-end relative bg-sky-50/70 rounded-2xl p-3 border-2 border-sky-100 min-h-[440px] select-none">
            
            <!-- 彩花容器 -->
            <div id="confetti-container" class="absolute inset-0 pointer-events-none overflow-hidden z-40"></div>

            <!-- 角色選擇按鈕 (左上角) -->
            <div class="absolute top-3 left-3 z-30 flex gap-1.5 bg-white/90 backdrop-blur-sm p-1 rounded-full shadow-md border border-sky-200">
                <button onclick="setGender('boy')" id="btn-boy" class="px-3 py-1 rounded-full text-xs font-black transition-all bg-blue-500 text-white shadow-sm">👦 小男生</button>
                <button onclick="setGender('girl')" id="btn-girl" class="px-3 py-1 rounded-full text-xs font-bold transition-all text-pink-700 hover:bg-pink-100">👧 小女生</button>
            </div>

            <!-- 對話氣泡 (右上角高處，絕對不會擋到角色) -->
            <div id="speech-bubble" class="absolute top-3 right-3 z-30 bg-white border-2 border-amber-400 rounded-2xl p-2.5 text-xs font-black text-amber-950 shadow-xl hidden max-w-[200px] leading-relaxed animate-bounce-short">
                <span id="speech-text">好想喝珍奶喔！快來幫我組裝吸管吧！</span>
            </div>

            <!-- 角色 SVG -->
            <div id="character" class="relative z-20 mb-[-4px] transition-transform duration-300"></div>

            <!-- 核心測量容器 (總高 300px = 30cm) -->
            <div class="relative w-72 h-[300px] flex items-end justify-center">
                
                <!-- 直線刻度尺 (所有數字與刻度完全位在直角尺左側) -->
                <div class="absolute left-0 top-0 bottom-0 w-12 border-r-2 border-slate-700 font-mono font-bold text-slate-700">
                    <!-- 30cm Mark (top: 0px) -->
                    <div class="absolute top-0 right-0 left-0 flex items-center justify-end pr-1 text-xs leading-none transform -translate-y-1/2">
                        <span class="mr-1">30</span>
                        <div class="w-2.5 h-[2px] bg-slate-700"></div>
                    </div>
                    
                    <!-- 27cm Mark (top: 30px) -->
                    <div class="absolute top-[30px] right-0 left-0 flex items-center justify-end pr-1 text-xs font-extrabold text-red-600 leading-none transform -translate-y-1/2">
                        <span class="mr-1">27</span>
                        <div class="w-3.5 h-[2px] bg-red-600"></div>
                    </div>

                    <!-- 25cm Mark (top: 50px - 與杯口點對點重合) -->
                    <div class="absolute top-[50px] right-0 left-0 flex items-center justify-end pr-1 text-xs font-bold text-slate-500 leading-none transform -translate-y-1/2">
                        <span class="mr-1">25</span>
                        <div class="w-2.5 h-[2px] bg-slate-500"></div>
                    </div>

                    <!-- 0cm Mark (bottom: 0px) -->
                    <div class="absolute bottom-0 right-0 left-0 flex items-center justify-end pr-1 text-xs leading-none transform translate-y-1/2">
                        <span class="mr-1">0</span>
                        <div class="w-2.5 h-[2px] bg-slate-700"></div>
                    </div>
                </div>

                <!-- 27公分 成功界線（紅虛線 100% 精準點對點貼合 27cm 刻度，無任何高度誤差） -->
                <div class="absolute left-[48px] right-0 top-[30px] h-0 border-t-2 border-dashed border-red-500 z-20 flex justify-end items-center pointer-events-none">
                    <span class="bg-red-500 text-white text-[11px] font-black px-2 py-0.5 rounded-r-md shadow-md transform translate-x-2 -translate-y-1/2 tracking-wider">
                        成功界線 27公分
                    </span>
                </div>

                <!-- 組合吸管展示區 (居中放置，由底部向上生長) -->
                <div id="straw-display" class="absolute bottom-1 z-20 flex flex-col items-center transition-all duration-500 left-1/2 transform -translate-x-1/2"></div>

                <!-- 吸珍珠動畫路徑區 -->
                <div id="sucking-pearls-container" class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-4 z-30 pointer-events-none"></div>

                <!-- 珍奶杯本體 (高度 250px = 25cm，頂部位於 top: 50px，邊緣壓在 25cm 刻度上) -->
                <div class="glass-cup w-44 h-[250px] rounded-b-3xl relative flex flex-col justify-end p-2 border-t-0 overflow-hidden">
                    <!-- 奶茶液體 (高度 220px = 22cm) -->
                    <div class="absolute inset-x-0 bottom-0 h-[220px] bg-gradient-to-t from-amber-300/90 via-amber-200/85 to-amber-100/70 rounded-b-2xl"></div>
                    
                    <!-- 杯底黑糖珍珠區 -->
                    <div id="pearls-group" class="relative z-10 grid grid-cols-5 gap-1.5 p-2 justify-items-center">
                        <div class="pearl-item w-4 h-4 bg-stone-900 rounded-full shadow-md border border-amber-950"></div>
                        <div class="pearl-item w-4 h-4 bg-amber-950 rounded-full shadow-md border border-amber-900"></div>
                        <div class="pearl-item w-4 h-4 bg-stone-900 rounded-full shadow-md border border-amber-950"></div>
                        <div class="pearl-item w-4 h-4 bg-amber-950 rounded-full shadow-md border border-amber-900"></div>
                        <div class="pearl-item w-4 h-4 bg-stone-900 rounded-full shadow-md border border-amber-950"></div>
                        <div class="pearl-item w-4 h-4 bg-amber-950 rounded-full shadow-md border border-amber-900"></div>
                        <div class="pearl-item w-4 h-4 bg-stone-900 rounded-full shadow-md border border-amber-950"></div>
                        <div class="pearl-item w-4 h-4 bg-amber-950 rounded-full shadow-md border border-amber-900"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：控制區與 A+B=C; C+D=E 算式展示 -->
        <div class="flex-1 flex flex-col justify-between gap-4">
            <div>
                <!-- 標題與目前長度 -->
                <div class="flex justify-between items-center border-b-2 border-amber-100 pb-2.5 mb-3">
                    <h2 class="text-base md:text-lg font-black text-amber-950 flex items-center gap-1">
                        <span>🛠️ 吸管選擇區</span>
                    </h2>
                    <span id="total-length" class="text-sm md:text-base font-black text-amber-700 bg-amber-100/80 px-3 py-1 rounded-xl border border-amber-300/80 shadow-sm">
                        目前：5 公分
                    </span>
                </div>

                <!-- 三格吸管選擇卡片 -->
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <!-- 第 1 支 (固定白色 5cm) -->
                    <div class="border-2 border-amber-300 bg-amber-50/60 rounded-2xl p-2 text-center relative flex flex-col items-center justify-between min-h-[110px] shadow-sm">
                        <span class="text-[10px] bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full font-black">第 1 支 (固定)</span>
                        <div class="h-12 flex items-center justify-center my-1">
                            <div class="w-3.5 h-10 bg-white border-2 border-gray-300 rounded shadow-sm"></div>
                        </div>
                        <p class="text-xs font-black text-slate-700">白色 (5cm)</p>
                    </div>

                    <!-- 第 2 支 -->
                    <div id="slot-2" class="border-2 border-dashed border-slate-300 bg-slate-50/50 rounded-2xl p-2 text-center flex flex-col items-center justify-center min-h-[110px] transition-all">
                        <span class="text-xs text-slate-400 font-bold">請點擊選擇<br>第 2 支吸管</span>
                    </div>

                    <!-- 第 3 支 -->
                    <div id="slot-3" class="border-2 border-dashed border-slate-300 bg-slate-50/50 rounded-2xl p-2 text-center flex flex-col items-center justify-center min-h-[110px] transition-all">
                        <span class="text-xs text-slate-400 font-bold">請點擊選擇<br>第 3 支吸管</span>
                    </div>
                </div>

                <!-- 選擇按鈕 (紅 7cm, 綠 9cm, 藍 14cm) -->
                <p class="text-xs font-extrabold text-amber-900 mb-2 flex items-center gap-1">
                    <span>👇 點擊下方按鈕加入吸管：</span>
                </p>
                <div class="grid grid-cols-3 gap-2.5 mb-4">
                    <button onclick="addStraw('red', 7)" class="group border-2 border-red-200 bg-red-50 hover:bg-red-100 hover:border-red-400 rounded-2xl p-2 flex flex-col items-center transition shadow-sm active:scale-95">
                        <div class="w-3.5 h-7 bg-red-500 rounded border border-red-600 group-hover:scale-110 transition-transform"></div>
                        <span class="text-xs font-black text-red-700 mt-1.5">紅色 (7cm)</span>
                    </button>
                    <button onclick="addStraw('green', 9)" class="group border-2 border-emerald-200 bg-emerald-50 hover:bg-emerald-100 hover:border-emerald-400 rounded-2xl p-2 flex flex-col items-center transition shadow-sm active:scale-95">
                        <div class="w-3.5 h-8 bg-emerald-500 rounded border border-emerald-600 group-hover:scale-110 transition-transform"></div>
                        <span class="text-xs font-black text-emerald-700 mt-1.5">綠色 (9cm)</span>
                    </button>
                    <button onclick="addStraw('blue', 14)" class="group border-2 border-blue-200 bg-blue-50 hover:bg-blue-100 hover:border-blue-400 rounded-2xl p-2 flex flex-col items-center transition shadow-sm active:scale-95">
                        <div class="w-3.5 h-10 bg-blue-500 rounded border border-blue-600 group-hover:scale-110 transition-transform"></div>
                        <span class="text-xs font-black text-blue-700 mt-1.5">藍色 (14cm)</span>
                    </button>
                </div>

                <!-- 兩步算式卡片區 (A + B = C; C + D = E) -->
                <div class="bg-amber-50/90 border-2 border-amber-200/90 rounded-2xl p-3.5 shadow-inner">
                    <p class="text-xs font-black text-amber-900 mb-1.5 flex items-center gap-1">
                        <span>📐 兩步長度加法算式：</span>
                    </p>
                    <div id="math-formula" class="text-xs md:text-sm font-mono font-black text-amber-950 flex flex-col gap-1.5 bg-white p-2.5 rounded-xl border border-amber-200/60">
                        <div>步驟 ①：5 cm (白色吸管)</div>
                        <div class="text-amber-600/90 font-sans text-xs">請選擇第 2 與第 3 支吸管...</div>
                    </div>
                </div>
            </div>

            <!-- 控制按鈕 -->
            <div class="flex gap-2.5 mt-2">
                <button onclick="resetStraws()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-black transition text-xs md:text-sm shadow-sm active:scale-95 border border-slate-300/80">
                    🔄 重新選取
                </button>
                <button onclick="testStraw()" class="flex-2 py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-2xl font-black shadow-lg transition text-xs md:text-sm px-6 active:scale-95 tracking-wider border border-orange-400">
                    🥤 放入吸管測試！
                </button>
            </div>
        </div>
    </main>

    <!-- JavaScript 邏輯控制區 -->
    <script>
        let currentGender = 'boy';
        let currentStraws = [{ color: 'white', length: 5 }];

        const colorMap = {
            white: { name: '白色', bg: 'bg-white', border: 'border-slate-300', text: '5cm' },
            red: { name: '紅色', bg: 'bg-red-500', border: 'border-red-600', text: '7cm' },
            green: { name: '綠色', bg: 'bg-emerald-500', border: 'border-emerald-600', text: '9cm' },
            blue: { name: '藍色', bg: 'bg-blue-500', border: 'border-blue-600', text: '14cm' }
        };

        function setGender(gender) {
            currentGender = gender;
            document.getElementById('btn-boy').className = gender === 'boy' 
                ? 'px-3 py-1 rounded-full text-xs font-black transition-all bg-blue-500 text-white shadow-sm' 
                : 'px-3 py-1 rounded-full text-xs font-bold transition-all text-blue-700 hover:bg-blue-100';
            document.getElementById('btn-girl').className = gender === 'girl' 
                ? 'px-3 py-1 rounded-full text-xs font-black transition-all bg-pink-500 text-white shadow-sm' 
                : 'px-3 py-1 rounded-full text-xs font-bold transition-all text-pink-700 hover:bg-pink-100';
            renderCharacter('normal');
        }

        function renderCharacter(expression) {
            const charDiv = document.getElementById('character');
            const isBoy = currentGender === 'boy';
            const clothColor = isBoy ? '#3b82f6' : '#ec4899';
            
            let eyeSvg = `<circle cx="38" cy="42" r="3.5" fill="#1e293b"/><circle cx="62" cy="42" r="3.5" fill="#1e293b"/>`;
            let mouthSvg = `<path d="M 42 56 Q 50 63 58 56" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />`;

            if (expression === 'happy') {
                eyeSvg = `<path d="M 32 42 Q 38 34 44 42" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M 56 42 Q 62 34 68 42" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>`;
                mouthSvg = `<path d="M 40 52 Q 50 72 60 52 Z" fill="#ef4444" stroke="#1e293b" stroke-width="1.5"/>`;
            } else if (expression === 'sad') {
                eyeSvg = `<circle cx="38" cy="42" r="3.5" fill="#1e293b"/><circle cx="62" cy="42" r="3.5" fill="#1e293b"/><path d="M 28 36 L 36 40" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/><path d="M 72 36 L 64 40" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>`;
                mouthSvg = `<path d="M 42 60 Q 50 50 58 60" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />`;
            }

            charDiv.innerHTML = `
                <svg width="86" height="86" viewBox="0 0 100 100" class="drop-shadow-md">
                    <path d="${isBoy ? 'M 25 38 Q 50 12 75 38 Q 75 22 50 16 Q 25 22 25 38' : 'M 18 45 Q 12 12 50 12 Q 88 12 82 45 Q 92 28 78 18 Q 50 8 22 18 Q 8 28 18 45'}" fill="${isBoy ? '#451a03' : '#78350f'}"/>
                    <circle cx="50" cy="48" r="26" fill="#fef08a"/>
                    ${eyeSvg}
                    ${mouthSvg}
                    <path d="M 32 74 L 68 74 L 72 100 L 28 100 Z" fill="${clothColor}"/>
                </svg>
            `;
        }

        function addStraw(color, length) {
            if (currentStraws.length < 3) {
                currentStraws.push({ color, length });
                updateUI();
            }
        }

        function resetStraws() {
            currentStraws = [{ color: 'white', length: 5 }];
            document.getElementById('speech-bubble').classList.add('hidden');
            document.getElementById('sucking-pearls-container').innerHTML = '';
            document.getElementById('confetti-container').innerHTML = '';
            document.getElementById('pearls-group').classList.remove('animate-pearls-roll');
            renderCharacter('normal');
            updateUI();
        }

        function updateUI() {
            const total = currentStraws.reduce((sum, s) => sum + s.length, 0);
            document.getElementById('total-length').innerText = `目前：${total} 公分`;

            for (let i = 2; i <= 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                const straw = currentStraws[i - 1];
                if (straw) {
                    const c = colorMap[straw.color];
                    slot.className = `border-2 border-amber-300 bg-amber-50/60 rounded-2xl p-2 text-center relative flex flex-col items-center justify-between min-h-[110px] shadow-sm`;
                    slot.innerHTML = `
                        <span class="text-[10px] bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full font-black">第 ${i} 支</span>
                        <div class="h-12 flex items-center justify-center my-1">
                            <div class="w-3.5 h-10 ${c.bg} ${c.border} border-2 rounded shadow-sm"></div>
                        </div>
                        <p class="text-xs font-black text-slate-700">${c.name} (${c.text})</p>
                    `;
                } else {
                    slot.className = `border-2 border-dashed border-slate-300 bg-slate-50/50 rounded-2xl p-2 text-center flex flex-col items-center justify-center min-h-[110px] transition-all`;
                    slot.innerHTML = `<span class="text-xs text-slate-400 font-bold">請點擊選擇<br>第 ${i} 支吸管</span>`;
                }
            }

            // 更新 A + B = C; C + D = E 算式
            const mathBox = document.getElementById('math-formula');
            if (currentStraws.length === 1) {
                mathBox.innerHTML = `<div>步驟 ①：5 cm (白色吸管)</div><div class="text-amber-600/90 font-sans text-xs">請選擇第 2 與第 3 支吸管...</div>`;
            } else if (currentStraws.length === 2) {
                const A = currentStraws[0].length;
                const B = currentStraws[1].length;
                const C = A + B;
                mathBox.innerHTML = `
                    <div class="text-amber-900">步驟 ①：${A} + ${B} = ${C}</div>
                    <div class="text-amber-600/90 font-sans text-xs">請選擇第 3 支吸管...</div>
                `;
            } else if (currentStraws.length === 3) {
                const A = currentStraws[0].length;
                const B = currentStraws[1].length;
                const D = currentStraws[2].length;
                const C = A + B;
                const E = C + D;
                mathBox.innerHTML = `
                    <div class="text-blue-700">步驟 ①：${A} + ${B} = ${C}</div>
                    <div class="text-emerald-700">步驟 ②：${C} + ${D} = ${E} (公分)</div>
                `;
            }

            // 渲染預覽吸管 (1cm = 10px)
            const strawDisplay = document.getElementById('straw-display');
            strawDisplay.innerHTML = '';
            currentStraws.forEach(s => {
                const el = document.createElement('div');
                el.style.height = `${s.length * 10}px`;
                el.className = `w-3.5 ${colorMap[s.color].bg} border border-black/20 rounded-xs shadow-xs`;
                strawDisplay.appendChild(el);
            });
        }

        function triggerConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'];
            
            for (let i = 0; i < 24; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti-piece';
                conf.style.left = `${Math.random() * 100}%`;
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDelay = `${Math.random() * 0.6}s`;
                container.appendChild(conf);
            }
        }

        function testStraw() {
            const speech = document.getElementById('speech-bubble');
            const speechText = document.getElementById('speech-text');
            const suckContainer = document.getElementById('sucking-pearls-container');
            const pearlsGroup = document.getElementById('pearls-group');

            if (currentStraws.length < 3) {
                speech.classList.remove('hidden');
                speechText.innerText = '⚠️ 請先選滿 3 支吸管才能組合測試喔！';
                return;
            }

            const total = currentStraws.reduce((sum, s) => sum + s.length, 0);
            speech.classList.remove('hidden');

            if (total > 27) {
                renderCharacter('happy');
                speechText.innerText = `🎉 成功！吸管總長 ${total}cm (大於 27cm)，順利吸到美味珍珠了！`;
                pearlsGroup.classList.add('animate-pearls-roll');
                
                suckContainer.innerHTML = `
                    <div class="sucking-pearl" style="animation-delay: 0s;"></div>
                    <div class="sucking-pearl" style="animation-delay: 0.35s;"></div>
                    <div class="sucking-pearl" style="animation-delay: 0.7s;"></div>
                `;
                triggerConfetti();
            } else {
                renderCharacter('sad');
                speechText.innerText = `😭 哎呀！吸管總長 ${total}cm (小於或等於 27cm)，沉進飲料裡吸不到珍珠...`;
                pearlsGroup.classList.remove('animate-pearls-roll');
                suckContainer.innerHTML = '';
                document.getElementById('confetti-container').innerHTML = '';
            }
        }

        // 初始化遊戲狀態
        window.onload = function() {
            renderCharacter('normal');
            updateUI();
        };
    </script>
</body>
</html>
